[package]
name = "rustoy-host"
version.workspace = true
edition.workspace = true
publish.workspace = true
default-run = "rustoy-host"

[dependencies]
rustoy-fs = { path = "../fs" }
rustoy-iso = { path = "../iso" }
fatfs = { version = "=0.3.6", default-features = false, features = ["std", "alloc"] }

[target.'cfg(windows)'.dependencies]
eframe = { version = "=0.32.3", default-features = false, features = ["default_fonts", "glow"] }
serde = { version = "1", features = ["derive"] }
windows-sys = { version = "0.61", features = ["Win32_UI_Shell"] }
wmi = { version = "=0.18.4", default-features = false }


[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "=0.32.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
