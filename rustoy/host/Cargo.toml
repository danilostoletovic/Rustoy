[package]
name = "rustoy-host"
version.workspace = true
edition.workspace = true
publish.workspace = true
default-run = "rustoy-host"

[dependencies]
rustoy-fs = { path = "../fs" }
rustoy-iso = { path = "../iso" }
fatfs = { version = "=0.3.6", default-features = false, features = ["std", "alloc"] }
lzma-rust2 = { version = "=0.13.0", default-features = false, features = ["std", "xz", "encoder"] }
sha2 = "=0.10.9"

[target.'cfg(windows)'.dependencies]
eframe = { version = "=0.32.3", default-features = false, features = ["default_fonts", "glow"] }
getrandom = '=0.3.4'


[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "=0.32.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
