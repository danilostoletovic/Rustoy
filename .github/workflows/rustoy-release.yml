name: Rustoy Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

concurrency:
  group: rustoy-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libwayland-dev libxkbcommon-dev libx11-dev pkg-config desktop-file-utils xvfb xauth libgl1-mesa-dri
      - name: Build and test
        run: |
          rustup update stable --profile minimal
          cargo +stable test --locked
          cargo +stable build --locked --release -p rustoy-host --bin rustoy-desktop
      - name: Package Linux AppImage
        run: |
          curl --fail --location --retry 3 -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          curl --fail --location --retry 3 -o appimage-runtime \
            https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          sha256sum --check <<'CHECKSUMS'
          ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool
          2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  appimage-runtime
          CHECKSUMS
          chmod +x appimagetool
          install -Dm755 target/release/rustoy-desktop AppDir/usr/bin/rustoy-desktop
          install -Dm644 COPYING AppDir/usr/share/licenses/rustoy/COPYING
          install -m644 rustoy/packaging/linux/{rustoy.desktop,rustoy.png} AppDir/
          ln -s usr/bin/rustoy-desktop AppDir/AppRun
          desktop-file-validate AppDir/rustoy.desktop
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run \
            --runtime-file appimage-runtime AppDir Rustoy-linux-x86_64.AppImage
      - name: Smoke-test AppImage launch
        run: |
          status=0
          timeout 15s xvfb-run -a ./Rustoy-linux-x86_64.AppImage --appimage-extract-and-run || status=$?
          test "$status" -eq 124
      - uses: actions/upload-artifact@v4
        with:
          name: rustoy-linux-x86_64
          path: Rustoy-linux-x86_64.AppImage
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build and embed the EFI payload
        shell: pwsh
        run: |
          rustup update stable --profile minimal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustup target add --toolchain stable x86_64-unknown-uefi
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo +stable build --locked --release -p rustoy-uefi --target x86_64-unknown-uefi
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:RUSTOY_EFI_IMAGE = (Resolve-Path target/x86_64-unknown-uefi/release/rustoy-uefi.efi).Path
          cargo +stable build --locked --release -p rustoy-host --bin rustoy-desktop
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item target/release/rustoy-desktop.exe Rustoy-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: rustoy-windows-x86_64
          path: Rustoy-windows-x86_64.exe
          if-no-files-found: error

  release:
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rustoy-*
          merge-multiple: true
      - name: Publish both builds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          assets=(Rustoy-linux-x86_64.AppImage Rustoy-windows-x86_64.exe)
          sha256sum "${assets[@]}" > SHA256SUMS.txt
          assets+=(SHA256SUMS.txt)
          if gh release view -- "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload --clobber -- "$RELEASE_TAG" "${assets[@]}"
          else
            gh release create --verify-tag --generate-notes -- "$RELEASE_TAG" "${assets[@]}"
          fi
